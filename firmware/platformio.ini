; PlatformIO Project Configuration
;
; Hackpad Firmware — Seeeduino XIAO SAMD21 (ATSAMD21G18A)
; 3-key Cherry MX macropad — Hack Club Stardance Event
;
; Build commands:
;   pio run                    — compile firmware
;   pio run --target upload    — flash via USB
;   pio run --target clean     — clean build artifacts
;
; Flash procedure:
;   1. Connect XIAO via USB
;   2. Double-tap the RESET button (enter bootloader mode)
;   3. Run: pio run --target upload

[env:xiao_samd21]
platform  = atmelsam
board     = seeed_xiao
framework = arduino

; Serial monitor for debug output
monitor_speed = 115200
